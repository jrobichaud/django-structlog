[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
  name = "django-structlog"
  description = "Structured Logging for Django"
  authors = [
    { name = "Jules Robichaud-Gagnon", email = "j.robichaudg+pypi@gmail.com" },
  ]
  readme = "README.rst"
  dynamic = ["version"]
  requires-python = ">=3.11"
  license = { text = "MIT" }
  dependencies = [
    "django>=5.2",
    "structlog>=21.4.0",
    "asgiref>=3.6.0",
    "django-ipware>=6.0.2",
  ]
  classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: System :: Logging",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
  ]

[project.urls]
  homepage = "https://github.com/jrobichaud/django-structlog"
  repository = "https://github.com/jrobichaud/django-structlog"
  documentation = "https://django-structlog.readthedocs.io"
  tracker = "https://github.com/jrobichaud/django-structlog/issues"
  changelog = "https://django-structlog.readthedocs.io/en/latest/changelog.html"

[project.optional-dependencies]
  celery = [
    "celery>=5.5"
  ]
  commands = [
    "django-extensions>=1.4.9"
  ]
  django-tasks = [
    "django>=6.0"
  ]

[tool.setuptools.dynamic]
  version = { attr = "django_structlog.__version__" }

[tool.setuptools.packages.find]
  include = [
    "django_structlog",
    "django_structlog.*",
  ]

[tool.black]
  line-length = 88
  target-version = [
    'py311',
    'py312',
    'py313',
    'py314',
    'py315',
  ]
  include = '\.pyi?$'
  exclude = '''
  /(
  \.git
  | \.hg
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  )/
  '''

[tool.ruff]
  line-length = 88
  target-version = "py311"
  lint.ignore = [
    'E501',
  ]

[tool.pytest.ini_options]
  DJANGO_SETTINGS_MODULE = "config.settings.test_demo_app"
  env = [
      "D:CELERY_BROKER_URL=redis://0.0.0.0:6379",
      "D:DJANGO_STRUCTLOG_CACHE=redis://0.0.0.0:6379"
  ]

[tool.tox]
  legacy_tox_ini = """
    [tox]
    # Test against latest supported version of each of python for each Django version.
    #
    # Also, make sure that all python versions used here are included in ./github/worksflows/main.yml
    envlist =
        py31{1,2,3,4}-django52-celery5{5,6}-redis8-kombu5,
        py31{2,3,4}-django60-celery5{5,6}-redis8-kombu5,
        py31{2,3,4,5}-django61-celery5{5,6}-redis8-kombu5,
    [gh-actions]
    python =
        3.11: py311
        3.12: py312
        3.13: py313
        3.14: py314
        3.15: py315
    [testenv]
    setenv =
        PYTHONPATH={toxinidir}
        CELERY_BROKER_URL=redis://0.0.0.0:6379
        DJANGO_STRUCTLOG_CACHE: redis://0.0.0.0:6379
        CELERY_RESULT_BACKEND=redis://0.0.0.0:6379
        DJANGO_SETTINGS_MODULE=config.settings.test
    pip_pre = True
    deps =
        redis8: redis>=8, <9
        kombu5: kombu<6
        celery55: Celery >=5.5, <5.6
        celery56: Celery >=5.6, <5.7
        django52: Django >=5.2, <6.0
        django60: Django >=6.0, <6.1
        django61: Django >=6.1, <6.2
        -r{toxinidir}/requirements/ci.txt

    commands = pytest --cov=./test_app --cov=./django_structlog --cov-append test_app
    """

[tool.coverage.run]
branch = true

[tool.coverage.report]
precision = 2
skip_covered = true
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError"
]
include = [
  "./django_structlog/*",
  "./django_structlog_demo_project/*",
  "./test_app/*",
]

[tool.mypy]
python_version="3.11"
strict=true
packages=[
  "django_structlog",
  "test_app",
]

[tool.isort]
profile = "black"
filter_files = true
