version: 2

updates:
  - package-ecosystem: pip
    directory: "/requirements"
    schedule:
      interval: weekly
    open-pull-requests-limit: 20
    groups:
      celery:
        patterns:
          - "kombu"
          - "celery"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: "/docs"
    schedule:
      interval: weekly
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: weekly
